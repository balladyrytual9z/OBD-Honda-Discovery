name: Build & Release from ZIP

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Install Android SDK Platform & Build-Tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find uploaded ZIP file
        id: find-zip
        run: |
          ZIP_FILE=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '\.zip$' | tail -n 1 || true)
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
          fi
          
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "Error: Nie znaleziono pliku ZIP w repozytorium!"
            exit 1
          fi
          
          echo "Znaleziono ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          
          BASENAME=$(basename "$ZIP_FILE" .zip)
          echo "basename=$BASENAME" >> $GITHUB_OUTPUT

      - name: Extract ZIP contents
        run: |
          mkdir -p extracted_source
          unzip -q "${{ steps.find-zip.outputs.zip_file }}" -d extracted_source

      - name: Locate Gradle project root
        id: find-gradle
        run: |
          GRADLE_FILE=$(find extracted_source -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: Nie znaleziono pliku build.gradle / settings.gradle wewnątrz ZIP-a!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Katalog projektu: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Build APK with Gradle
        run: |
          cd "${{ steps.find-gradle.outputs.project_dir }}"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find built APK
        id: find-apk
        run: |
          PROJECT_DIR="${{ steps.find-gradle.outputs.project_dir }}"
          APK_PATH=$(find "$PROJECT_DIR" -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: Nie znaleziono zbudowanego pliku APK!"
            exit 1
          fi
          echo "Znaleziono APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.find-zip.outputs.basename }}-${{ github.run_number }}
          name: Release ${{ steps.find-zip.outputs.basename }} (Build #${{ github.run_number }})
          files: |
            ${{ steps.find-apk.outputs.apk_path }}
            ${{ steps.find-zip.outputs.zip_file }}
          body: |
            Automatyczny release wygenerowany z pliku ZIP: `${{ steps.find-zip.outputs.zip_file }}`
            Commit: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
