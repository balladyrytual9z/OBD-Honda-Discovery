name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Locate project & prepare Gradle
        run: |
          # Znajdź katalog zawierający settings.gradle lub settings.gradle.kts
          SETTINGS_FILE=$(find . -maxdepth 2 -name "settings.gradle*" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Nie znaleziono pliku settings.gradle ani settings.gradle.kts w repozytorium!"
            echo "Aktualna struktura plików:"
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Znaleziono projekt w: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          cd "$PROJECT_DIR"

          # Jeśli brakuje wrapper.jar, wygeneruj go
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generowanie Gradle Wrapper 8.2..."
            gradle wrapper --gradle-version 8.2
          fi

          chmod +x gradlew || true

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HondaOBDDiscovery-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
