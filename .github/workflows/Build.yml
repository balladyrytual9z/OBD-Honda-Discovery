name: Build APK from iPhone ZIP

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unpack ZIP & prepare workspace
        run: |
          # Znajdź dowolny plik ZIP wrzucony do repozytorium
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Nie znaleziono pliku .zip w repozytorium!"
            exit 1
          fi

          echo "Rozpakowywanie: $ZIP_FILE"
          unzip -o -q "$ZIP_FILE"

          # Usunięcie śmieci dodawanych przez iOS / macOS
          rm -rf __MACOSX
          find . -name "._*" -delete || true

          # Znajdź katalog, w którym znajduje się settings.gradle lub settings.gradle.kts
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::W pliku ZIP nie znaleziono settings.gradle ani settings.gradle.kts!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Katalog projektu: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          cd "$PROJECT_DIR"

          # Automatyczne dodanie repozytorium JitPack dla biblioteki MPAndroidChart
          if [ -f "settings.gradle.kts" ] && ! grep -q "jitpack.io" settings.gradle.kts; then
            echo "Dodawanie JitPack do settings.gradle.kts..."
            sed -i '/mavenCentral()/a \        maven { url = java.net.URI("https://jitpack.io") }' settings.gradle.kts
          fi

          # Jeśli w ZIP nie ma pliku gradle-wrapper.jar, wygeneruj go
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generowanie Gradle Wrapper 8.2..."
            gradle wrapper --gradle-version 8.2
          fi

          chmod +x gradlew || true

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HondaOBDDiscovery-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HondaOBDDiscovery-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
