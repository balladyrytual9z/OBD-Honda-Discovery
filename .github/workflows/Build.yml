name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HondaOBDDiscovery

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: HondaOBDDiscovery

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar missing, regenerating..."
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HondaOBDDiscovery-debug
          path: HondaOBDDiscovery/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: List outputs
        if: always()
        run: find app/build/outputs -name "*.apk" || true
