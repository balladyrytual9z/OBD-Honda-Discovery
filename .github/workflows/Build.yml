

name: Build Honda OBD Discovery APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate and prepare project
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          SRC=""

          # Project directly in repository root
          if [ -f "./settings.gradle" ] || [ -f "./settings.gradle.kts" ]; then
            SRC="."
          fi

          # Search existing project directories
          if [ -z "$SRC" ]; then
            while IFS= read -r SETTINGS; do
              DIR=$(dirname "$SETTINGS")
              if [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then
                SRC="$DIR"
                break
              fi
            done < <(
              find . -maxdepth 6 -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                ! -path './.git/*' | sort
            )
          fi

          # Extract ZIP if project was not found
          if [ -z "$SRC" ]; then
            ZIP=$(find . -maxdepth 3 -type f -iname '*.zip' \
              ! -path './.git/*' | head -n 1 || true)

            if [ -z "$ZIP" ]; then
              echo "::error::Nie znaleziono projektu Gradle ani ZIP."
              find . -maxdepth 3 -type f | head -100
              exit 1
            fi

            echo "Extracting: $ZIP"
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src

            while IFS= read -r SETTINGS; do
              DIR=$(dirname "$SETTINGS")
              if [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; then
                SRC="$DIR"
                break
              fi
            done < <(
              find _src -maxdepth 8 -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) \
                | sort
            )
          fi

          if [ -z "$SRC" ]; then
            echo "::error::Nie znaleziono projektu z modułem app."
            find . -maxdepth 6 -type f | head -150
            exit 1
          fi

          SRC=$(cd "$SRC" && pwd)

          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "Project directory: $SRC"
          ls -la "$SRC"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Gradle
        id: gradle
        working-directory: ${{ steps.prepare.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_CMD=""

          # Use a complete and valid Gradle Wrapper if available
          if [ -f "./gradlew" ] && \
             [ -s "./gradle/wrapper/gradle-wrapper.jar" ] && \
             [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then

            chmod +x ./gradlew

            if jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
              GRADLE_CMD="./gradlew"
            fi
          fi

          # Fall back to an official Gradle distribution
          if [ -z "$GRADLE_CMD" ]; then
            VERSION="8.9"

            if [ -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
              URL=$(grep -E '^distributionUrl=' \
                gradle/wrapper/gradle-wrapper.properties \
                | tail -n 1 | cut -d '=' -f 2- \
                | sed 's/\\:/:/g' || true)

              if [[ "$URL" =~ gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-(bin|all)\.zip ]]; then
                VERSION="${BASH_REMATCH[1]}"
              fi
            fi

            echo "Using Gradle $VERSION"

            GRADLE_DIR="$RUNNER_TEMP/gradle"
            mkdir -p "$GRADLE_DIR"

            if [ ! -x "$GRADLE_DIR/gradle-$VERSION/bin/gradle" ]; then
              curl -fL --retry 3 \
                "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip" \
                -o "$GRADLE_DIR/gradle.zip"

              unzip -q -o "$GRADLE_DIR/gradle.zip" -d "$GRADLE_DIR"
              rm -f "$GRADLE_DIR/gradle.zip"
            fi

            GRADLE_CMD="$GRADLE_DIR/gradle-$VERSION/bin/gradle"
          fi

          echo "gradle_cmd=$GRADLE_CMD" >> "$GITHUB_OUTPUT"
          "$GRADLE_CMD" --version

      # Do not pass a package list to setup-android.
      # This avoids the obsolete "tools" package lookup.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT are unset."
            exit 1
          fi

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager -perm /111 2>/dev/null \
              | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Nie znaleziono wykonywalnego sdkmanager."
            find "$SDK_ROOT" -maxdepth 4 -name sdkmanager -print || true
            exit 1
          fi

          echo "SDK manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project modules
        working-directory: ${{ steps.prepare.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=== GRADLE MODULE FILES ==="
          find . -maxdepth 4 -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::Brak modułu app."
            exit 1
          fi

          if [ ! -f "dtcclear/build.gradle" ] && \
             [ ! -f "dtcclear/build.gradle.kts" ]; then
            echo "::warning::Nie znaleziono modułu dtcclear. Pomijam go."
          fi

      - name: Verify Android 9 compatibility
        working-directory: ${{ steps.prepare.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking configured SDK versions..."

          grep -R -n -E \
            'minSdk([Vv]ersion)?[[:space:]]*(=|[[:space:]])*28|targetSdk([Vv]ersion)?[[:space:]]*(=|[[:space:]])*28' \
            app/build.gradle app/build.gradle.kts 2>/dev/null || true

          echo "The APK must have minSdk <= 28 to install on Android 9."

      - name: Run unit tests
        working-directory: ${{ steps.prepare.outputs.src }}
        shell: bash
        continue-on-error: true
        env:
          GRADLE_CMD: ${{ steps.gradle.outputs.gradle_cmd }}
        run: |
          set -euo pipefail
          "$GRADLE_CMD" test --stacktrace --no-daemon

      - name: Build APK
        working-directory: ${{ steps.prepare.outputs.src }}
        shell: bash
        env:
          GRADLE_CMD: ${{ steps.gradle.outputs.gradle_cmd }}
        run: |
          set -euo pipefail

          TASKS=(":app:assembleDebug")

          if [ -f "dtcclear/build.gradle" ] || \
             [ -f "dtcclear/build.gradle.kts" ]; then
            TASKS+=(":dtcclear:assembleDebug")
          fi

          "$GRADLE_CMD" "${TASKS[@]}" \
            --stacktrace \
            --no-daemon

          echo "=== GENERATED APK FILES ==="
          find . -type f -path '*/build/outputs/apk/*/*.apk' -print

          if ! find app/build/outputs/apk -type f -name '*.apk' \
            -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Nie wygenerowano APK modułu app."
            exit 1
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Honda-OBD-Discovery-APKs
          path: |
            ${{ steps.prepare.outputs.src }}/app/build/outputs/apk/**/*.apk
            ${{ steps.prepare.outputs.src }}/dtcclear/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

